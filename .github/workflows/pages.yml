name: Deploy site to GitHub Pages

# Builds the Jekyll app in site/ and publishes it to flickbolt.com.
# Without this workflow GitHub Pages falls back to building the repository
# root, which renders README.md instead of the platform UI.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "CNAME"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      # enablement:true flips the Pages source to "GitHub Actions" so the
      # legacy branch-root build (the one serving README.md) stops winning.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: site

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # tailwindcss is pinned to an exact version in package.json, so plain
      # `npm install` resolves the same compiler on every run.
      - name: Compile Tailwind
        run: |
          npm install --no-audit --no-fund
          npm run build:css

      - name: Build Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination ../_site

      - uses: actions/upload-pages-artifact@v3
        with:
          # Paths are resolved from the workspace root, not `defaults.run`.
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
